
name: THE BEST SCENE Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/THE_BEST_SCENE.apk

      - name: Build Windows EXE
        run: |
          godot --headless --path . --export-release "Windows Desktop" build/THE_BEST_SCENE.exe

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: THE-BEST-SCENE-BUILDS
          path: build/*
          

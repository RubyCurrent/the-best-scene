
name: THE BEST SCENE Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Check Godot
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Create build directory
        run: mkdir -p build

      - name: Build Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/THE_BEST_SCENE.apk

      - name: Build Windows EXE
        run: |
          godot --headless --path . --export-release "Windows Desktop" build/THE_BEST_SCENE.exe

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: THE-BEST-SCENE-BUILDS
          path: build/*
          if-no-files-found: error
          

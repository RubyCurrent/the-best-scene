
name: THE BEST SCENE Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Godot project
        run: |
          mkdir -p game/build

          cp project.godot/project.godot game/project.godot
          cp export_presets.cfg/export_presets.cfg game/export_presets.cfg
          cp Main.tscn/Main.tscn game/Main.tscn

          cp Main.gd game/Main.gd
          cp Player.gd game/Player.gd
          cp TouchJoystick.gd game/TouchJoystick.gd
          cp TouchLook.gd game/TouchLook.gd

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Prepare Android debug keystore
        run: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Check project
        run: |
          godot --headless --editor --path game --quit

      - name: Build Android APK
        run: |
          godot --headless --verbose --path game \
            --export-debug "Android" game/build/THE_BEST_SCENE.apk

      - name: Build Windows EXE
        run: |
          godot --headless --path game \
            --export-release "Windows Desktop" game/build/THE_BEST_SCENE.exe

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: THE-BEST-SCENE-BUILDS
          path: game/build/*
          if-no-files-found: error
          
